name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Validate plugin.json
        run: |
          python3 -c '
          import json, sys
          data = json.load(open("plugin.json"))
          required = ["id", "name", "version", "author", "description", "types", "homepage", "repository", "minReplacearrVersion", "entry", "module"]
          missing = [k for k in required if k not in data or data[k] in ("", [], None)]
          if missing:
              raise SystemExit(f"missing {missing}")
          print("ok")
          '
      - name: Build
        run: CGO_ENABLED=0 go build -o /tmp/plugin .
